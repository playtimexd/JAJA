<!doctype html><meta charset="utf-8"><title>Arts preview</title>
<style>body{font-family:system-ui;margin:12px;background:#f4f1ea}h2{margin:18px 0 6px;font-size:18px}.row{display:flex;flex-wrap:wrap;gap:8px}
.st{width:var(--w,260px);background:#fff;border-radius:10px;padding:6px;font-size:12px}.st svg{width:calc(var(--w,260px) - 12px);height:auto;display:block;background:#fff;border:1px solid #ddd}</style>
<div id="o"></div><script>if(new URLSearchParams(location.search).get('final'))document.documentElement.style.setProperty('--w','380px')</script>
<script type="module">
const q = new URLSearchParams(location.search), cat = q.get('cat') || 'dessin', from = +(q.get('from') || 0), n = +(q.get('n') || 999), id = q.get('id'), fin = q.get('final');
const { projects } = await import(`../js/content/arts/${cat}.js?${Date.now()}`);
const list = id ? projects.filter((p) => p.id === id) : projects.slice(from, from + n);
document.getElementById('o').innerHTML = list.map((p) => `<h2>${p.emoji} ${p.id} — ${p.title.fr} (niv ${p.level}, ${p.minutes} min)</h2><div class="row">${(fin ? p.steps.slice(-1) : p.steps).map((s, i) => `<div class="st">${s.svg}<div><b>${i + 1}.</b> ${s.text.fr}</div></div>`).join('')}</div>`).join('');
</script>
