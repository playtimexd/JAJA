<!doctype html><meta charset="utf-8"><title>Why preview</title>
<style>body{font-family:system-ui;margin:12px;background:#f4f1ea}h2{margin:16px 0 6px;font-size:17px}.row{display:flex;flex-wrap:wrap;gap:8px}.st{width:300px;background:#fff;border-radius:10px;padding:6px;font-size:13px}.st svg{width:288px;height:auto;display:block;border:1px solid #ddd}.q{color:#555}</style>
<div id="o"></div>
<script type="module">
const q = new URLSearchParams(location.search), cat = q.get('cat') || 'animaux', from = +(q.get('from') || 0), n = +(q.get('n') || 999);
const { topics } = await import(`../js/content/why/${cat}.js?${Date.now()}`);
document.getElementById('o').innerHTML = topics.slice(from, from + n).map((t) => `<h2>${t.emoji} ${t.id} — ${t.q.zh} / ${t.q.fr} (niv ${t.level})</h2><div class="row">${t.slides.map((s, i) => `<div class="st">${s.svg || ''}<div><b>${i + 1}.</b> ${s.zh}<br>${s.fr}</div></div>`).join('')}<div class="st q">${t.quiz.map((x) => `<p><b>${x.zh}</b><br>${x.options.map((o, k) => (k === x.answer ? '✔ ' : '· ') + o.zh).join('<br>')}</p>`).join('')}</div></div>`).join('');
</script>
